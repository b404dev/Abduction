name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install build dependencies
        run: npm ci && go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
        working-directory: frontend
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          "$(go env GOPATH)/bin/wails" build -tags webkit2_41 -ldflags "-X main.version=${VERSION}"
          mkdir staging
          cp build/bin/abduction staging/abduction
          cp build/linux/reaper-512.png staging/abduction.png
          tar -czf abduction-linux-amd64.tar.gz -C staging abduction abduction.png
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: abduction-linux-amd64.tar.gz

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        run: npm ci && go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
        working-directory: frontend
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          "$(go env GOPATH)/bin/wails" build -platform darwin/universal -ldflags "-X main.version=${VERSION}"
          APP_PATH="$(find build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "${APP_PATH}"
          mkdir staging
          cp -R "${APP_PATH}" staging/Abduction.app
          tar -czf abduction-macos-arm64.tar.gz -C staging Abduction.app
          cp abduction-macos-arm64.tar.gz abduction-macos-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: abduction-macos-*.tar.gz

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: cd artifacts && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
